name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://emily:emily@localhost:5432/emily
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: emily, POSTGRES_PASSWORD: emily, POSTGRES_DB: emily }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U emily" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Fails on high/critical advisories (accepted ones live in package.json → pnpm.auditConfig)
      - run: pnpm audit --audit-level high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm build
